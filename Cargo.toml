[package]
name = "pman"
version = "0.1.0"
edition = "2021"
description = "Terminal documentation reader: man-page style pages and ranked search for any language or tool, installed as packs"
license = "MIT"

[dependencies]
crossterm = "0.28"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["net"]
net = ["dep:ureq"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
